site_name: ROS 2 練習帳 — C++ と ROS 2 の教材
site_description: >-
  const や static で手が止まる人から、rclcpp のコードを読めるようになるまで。
  読み物と課題が 1 対 1 で対応した ROS 2 / C++ の教材です。
site_author: Nyanziba

docs_dir: docs
site_dir: site

# false にしないと file:// で読めません。
# true だと各ページが <名前>/index.html に置かれ、リンクが href="../07_static/" の
# ようにディレクトリを指します。http で配信するなら綺麗ですが、ブラウザで
# ファイルを直接開くとディレクトリ一覧が出るだけでページに飛べません。
# false にすると <名前>.html が出力され、リンクも .html を直接指すので、
# zip を展開して index.html を開くだけで全ページを辿れます。
use_directory_urls: false

# site_url は意図的に設定していません。
# 設定すると（空文字を含めて）アセットのパスがルート絶対（/assets/...）になり、
# zip を展開してローカルで開いたときに CSS も JS も読めなくなります。

theme:
  name: material
  language: ja
  # Google Fonts を取りに行かせない。オフラインでもそのまま読めるように
  # 外部への通信をゼロにして、システムフォントで描画させます。
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え

plugins:
  # lang: ja で lunr-languages の日本語トークナイザ（TinySegmenter）が入ります。
  # これを入れないと日本語が空白区切りで切られ、全文検索がほぼ効きません。
  - search:
      lang: ja

markdown_extensions:
  - meta
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - toc:
      permalink: true
      permalink_title: この見出しへのリンク
      # 既定の slugify は見出しを ASCII に落としてから slug を作るため、
      # 日本語の見出しが全部消えて「#65-」のようなアンカーになります。
      # pymdownx 版は Unicode をそのまま残し、GitHub と同じ規則で slug を作るので、
      # GitHub 上で読んだときと同じアンカーが site 側でも通ります。
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

