# 英語版サイト。日本語版（mkdocs.yml）の設定を引き継ぎ、違うところだけ上書きする。
#
#   mkdocs build                      # 日本語版 → site/
#   mkdocs build -f mkdocs.en.yml     # 英語版   → site/en/
#
# **必ず日本語版を先に建てる。** 日本語版のビルドは site/ を丸ごと掃除するので、
# 英語版を先に建てると site/en/ が消える。
#
# リストの設定（nav / plugins / palette / markdown_extensions）は引き継がれず
# 丸ごと置き換わるので、変えたいものは全部書き直している。
INHERIT: mkdocs.yml

site_name: ROS 2 Drill — C++ and ROS 2 course
site_description: >-
  From getting stuck on const and static to reading rclcpp code.
  A ROS 2 / C++ course where every chapter has a matching exercise.
site_url: https://nyanziba.github.io/ros2-cpp-drill/en/

docs_dir: docs-en
site_dir: site/en

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - meta
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - toc:
      permalink: true
      permalink_title: Link to this heading
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}

# 言語切替。リンクはページからの相対で解決されるので、site/en/ から見た日本語版のトップ。
extra:
  alternate:
    - name: English
      link: index.html
      lang: en
    - name: 日本語
      link: ../index.html
      lang: ja

