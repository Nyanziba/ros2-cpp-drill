name: docs

# 教材サイトをビルドして GitHub Pages に配信する。
# --strict なのでリンク切れと見出しアンカーの不一致は CI で落ちる。
#
# Pages を有効にするには Settings > Pages > Source を「GitHub Actions」に
# しておく必要がある（一度設定すれば以降は不要）。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'docs-en/**'
      - 'mkdocs.yml'
      - 'mkdocs.en.yml'
      - 'mkdocs.lyrical.yml'
      - 'mkdocs.lyrical.en.yml'
      - 'hooks/**'
      - 'overrides/**'
      - 'outputs/**'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'docs-en/**'
      - 'mkdocs.yml'
      - 'mkdocs.en.yml'
      - 'mkdocs.lyrical.yml'
      - 'mkdocs.lyrical.en.yml'
      - 'hooks/**'
      - 'overrides/**'
      - 'outputs/**'
      - 'docs-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。あとから来た push を優先する。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: 依存をインストール
        run: pip install -r docs-requirements.txt

      - name: ビルド（警告をエラーにする）
        run: mkdocs build --strict

      # 英語版は site/en/ に出る。日本語版のビルドが site/ を掃除するので必ず後に。
      - name: 英語版をビルド（警告をエラーにする）
        run: mkdocs build --strict -f mkdocs.en.yml

      # Lyrical 版は site/lyrical/ と site/lyrical/en/ に出る。Jazzy 版の後に、日本語・英語の順で建てる。
      # 出力は outputs/lyrical/ のファイルを hooks/drill_version.py が差し込む（無ければここで落ちる）。
      - name: Lyrical 版をビルド（警告をエラーにする）
        run: |
          mkdocs build --strict -f mkdocs.lyrical.yml
          mkdocs build --strict -f mkdocs.lyrical.en.yml

      - name: 生成されたページ数を確認
        run: |
          count=$(find site -name '*.html' | wc -l)
          echo "生成された HTML: ${count} ページ"
          test "$count" -ge 50
          test -f site/en/index.html
          test -f site/lyrical/index.html
          test -f site/lyrical/en/index.html

      # Pages 用の tar と、普通にダウンロードできる zip の両方を置く。
      # 前者は deploy ジョブが使い、後者はオフラインで配りたいとき用。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30

  deploy:
    # pull_request では配信しない（fork からの PR に配信権限を渡さないため）
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
