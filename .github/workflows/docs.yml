name: docs

# 教材サイトをビルドして artifact として置くワークフロー。
# --strict なのでリンク切れと見出しアンカーの不一致は CI で落ちる。
# GitHub Pages で配信したい場合は README の「サイトを公開する」を参照。
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'docs-requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - name: 依存をインストール
        run: pip install -r docs-requirements.txt

      - name: ビルド（警告をエラーにする）
        # --strict でリンク切れやナビゲーションの取りこぼしを CI で落とします。
        run: mkdocs build --strict

      - name: 生成されたページ数を確認
        run: |
          count=$(find site -name '*.html' | wc -l)
          echo "生成された HTML: ${count} ページ"
          test "$count" -ge 50

      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/
          retention-days: 30
